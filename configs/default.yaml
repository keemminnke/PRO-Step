# Default configuration for consensus-based auto-labeling pipeline

# Data settings
data:
  input_format: "jsonl"  # jsonl, json, hf_dataset
  batch_size: 32
  num_workers: 4
  max_trajectory_length: 50

# RPE Labeling (Small Model)
# Using Qwen3-7B for MC estimation
rpe:
  model_name: "Qwen/Qwen2.5-7B-Instruct"  # Updated to Qwen3-7B equivalent
  model_path: null  # Override with local path if needed
  device: "cuda"
  max_model_len: 16384  # Extend context length for long prompts

  # Monte Carlo rollout settings
  num_rollouts: 5
  max_rollout_steps: 20
  temperature: 0.8
  top_p: 0.95

  # RPE threshold for binary labeling
  threshold: 0.5  # P_t >= 0.5 → GOOD, P_t < 0.5 → BAD

  # Efficiency
  use_cache: true
  batch_inference: true

# Judge Labeling (Large Model)
# Using GPT-20B for label verification
judge:
  model_name: "gpt-20b"  # GPT-20B for high-quality judgments
  model_path: null
  device: "cuda"
  api_provider: "openai"  # openai, anthropic, custom

  # Generation settings
  temperature: 0.3  # Lower for more consistent judgments
  max_tokens: 512
  top_p: 0.9

  # Retry logic for API calls
  max_retries: 3
  retry_delay: 2.0

  # Judge prompt style
  prompt_style: "versaprm"  # versaprm, genprm, custom
  include_reasoning: true

  # Evaluation criteria
  use_gold_answer: true
  use_supporting_facts: true

# Consensus Module
consensus:
  # Strategy: With binary labels, only one strategy (both must agree)
  strategy: "strict"

  # Binary consensus rules
  rules:
    # Case 1: Both agree it's GOOD
    positive_consensus:
      rpe: ["GOOD"]
      judge: ["GOOD"]
      label: 1

    # Case 2: Both agree it's BAD
    negative_consensus:
      rpe: ["BAD"]
      judge: ["BAD"]
      label: 0

    # Case 3: Disagreement (RPE=GOOD, Judge=BAD or vice versa) → Filter out
    filter_disagreement: true

  # Minimum agreement score (0-1)
  min_agreement: 0.8

  # Trajectory-level filtering
  trajectory_level: true  # If any step conflicts, discard entire trajectory

  # Confidence weighting (if using soft consensus)
  weights:
    rpe: 0.3
    judge: 0.7

# Output settings
output:
  save_individual_labels: true  # Save RPE and Judge labels separately
  save_consensus_only: true     # Save final consensus-filtered dataset
  save_metadata: true           # Include metadata (confidence, reasoning, etc.)

  format: "jsonl"
  compression: null  # null, "gzip", "bz2"

# Evaluation
evaluation:
  compute_metrics: true
  metrics:
    - "agreement_rate"
    - "coverage"
    - "label_distribution"
    - "confidence_distribution"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_to_file: true
  log_dir: "outputs/logs"
  use_wandb: false
  wandb_project: "prmrag"

# Misc
seed: 42
